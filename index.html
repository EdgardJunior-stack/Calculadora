<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Calculadora responsiva desenvolvida com HTML semântico, CSS e JavaScript.">

    <title>Calculadora</title>

    <!-- ======================================================
         ESTILOS
    ======================================================= -->

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- ======================================================
         CABEÇALHO
    ======================================================= -->

    <header class="cabecalho">
        

        <h1>
            Calculadora
            <span>FullStack</span>
        </h1>

        <p class="cabecalho__descricao">
            Uma calculadora responsiva criada com HTML semântico,
            CSS moderno e JavaScript.
        </p>
    </header>


    <!-- ======================================================
         CONTEÚDO PRINCIPAL
    ======================================================= -->

    <main class="conteudo-principal">

        <!-- ==================================================
             APLICAÇÃO DA CALCULADORA
        =================================================== -->

        <section class="calculadora" aria-labelledby="titulo-calculadora">

            <div class="calculadora__topo">

                <p class="calculadora__numero">
                    01 / CALCULATOR
                </p>

                <h2 id="titulo-calculadora">
                    Faça seu cálculo
                </h2>

            </div>


            <!-- ==============================================
                 FORMULÁRIO
            =============================================== -->

            <form class="calculadora__formulario" id="formulario-calculadora" novalidate>

                <fieldset>

                    <legend class="sr-only">
                        Dados necessários para realizar o cálculo
                    </legend>


                    <!-- ======================================
                         PRIMEIRO NÚMERO
                    ======================================= -->

                    <div class="campo">

                        <label for="numero1">
                            Primeiro número
                        </label>

                        <input type="number" id="numero1" name="numero1" inputmode="decimal" step="any"
                            placeholder="Ex: 10" autocomplete="off">

                    </div>


                    <!-- ======================================
                         SEGUNDO NÚMERO
                    ======================================= -->

                    <div class="campo">

                        <label for="numero2">
                            Segundo número
                        </label>

                        <input type="number" id="numero2" name="numero2" inputmode="decimal" step="any"
                            placeholder="Ex: 5" autocomplete="off">

                    </div>


                    <!-- ======================================
                         OPERAÇÃO MATEMÁTICA
                    ======================================= -->

                    <div class="campo">

                        <label for="operacao">
                            Operação
                        </label>

                        <select id="operacao" name="operacao">

                            <option value="">
                                Selecione uma operação
                            </option>

                            <option value="somar">
                                Somar
                            </option>

                            <option value="subtrair">
                                Subtrair
                            </option>

                            <option value="multiplicar">
                                Multiplicar
                            </option>

                            <option value="dividir">
                                Dividir
                            </option>

                        </select>

                    </div>


                    <!-- ======================================
                         BOTÃO DE CÁLCULO
                    ======================================= -->

                    <button class="botao-calcular" type="submit">

                        <span>Calcular</span>

                        <span class="botao-calcular__icone" aria-hidden="true">
                            →
                        </span>

                    </button>

                </fieldset>

            </form>


            <!-- ==============================================
                 RESULTADO
            =============================================== -->

            <section class="resultado" aria-labelledby="titulo-resultado">

                <div class="resultado__cabecalho">

                    <h3 id="titulo-resultado">
                        Resultado
                    </h3>

                    <span aria-hidden="true">
                        ↘
                    </span>

                </div>

                <output id="resultado" class="resultado__valor" aria-live="polite" role="status">
                    0
                </output>

            </section>

        </section>

    </main>


    <!-- ======================================================
         RODAPÉ
    ======================================================= -->

    <footer class="rodape">

        <p>
            Desenvolvido com
            <strong>HTML</strong>,
            <strong>CSS</strong> e
            <strong>JavaScript</strong>.
        </p>

        <p>
            Projeto de Edgard Jr.
        </p>

    </footer>


    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script src="script.js"></script>

</body>

</html>
